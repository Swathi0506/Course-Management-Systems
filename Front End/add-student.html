<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student | Student Management System</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="add-student.css">
</head>

<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">
            🎓 Student Management System
        </a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="dashboard.html">Dashboard</a>
            <a class="nav-link active" href="add-student.html">Add Student</a>
            <a class="nav-link" href="login.html">Logout</a>
        </div>
    </div>
</nav>

<!-- Add Student Form -->
<div class="container mt-5 mb-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-header bg-success text-white text-center">
                    <h3><i class="bi bi-person-plus-fill"></i> Add Student</h3>
                </div>

                <div class="card-body">

                    <form id="studentForm">

                        <div class="mb-3">
                            <label class="form-label">Student ID</label>
                            <input type="text" id="studentId" class="form-control" placeholder="Enter Student ID">
                            <span id="idError"></span>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Student Name</label>
                            <input type="text" id="studentName" class="form-control" placeholder="Enter Student Name">
                            <span id="nameError"></span>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Department</label>
                            <input type="text" id="department" class="form-control" placeholder="Enter Department">
                            <span id="deptError"></span>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" id="email" class="form-control" placeholder="Enter Email">
                            <span id="emailError"></span>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Mobile Number</label>
                            <input type="tel" id="mobile" class="form-control" placeholder="Enter Mobile Number">
                            <span id="mobileError"></span>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-success">
                                <i class="bi bi-plus-circle"></i> Add Student
                            </button>
                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- Footer -->
<footer class="bg-primary text-white text-center p-3">
    © 2026 Student Management System | Add Student
</footer>

<script src="add-student.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
